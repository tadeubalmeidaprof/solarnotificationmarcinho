services:
  - type: web
    name: solcare-bot-solis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webhook:app
    healthCheckPath: /health
    envVars:
      - key: AI_ENABLED
        value: "true"
      - key: AI_MEMORY_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TIMEOUT_SECONDS
        value: "12"
      - key: GROQ_MAX_COMPLETION_TOKENS
        value: "600"
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTHORIZED_CHAT_ID
        sync: false
      - key: WHAPI_TOKEN
        sync: false
      - key: WHAPI_CHAT_ID
        sync: false
      - key: WHAPI_API_URL
        value: https://gate.whapi.cloud
      - key: SOLIS_API_ID
        sync: false
      - key: SOLIS_API_SECRET
        sync: false
      - key: SOLIS_BASE_URL
        sync: false
      - key: SOLIS_STATION_ID
        sync: false
      - key: STATION_LATITUDE
        sync: false
      - key: STATION_LONGITUDE
        sync: false
      - key: WEATHERAPI_KEY
        sync: false
      - key: ENERGY_TARIFF
        sync: false
      - key: AVERAGE_CONSUMPTION_KWH
        sync: false
      - key: TUSD_FIO_B_KWH
        sync: false
      - key: FIO_B_PERCENTAGE
        sync: false
