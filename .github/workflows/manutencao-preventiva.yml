name: Monitoramento preventivo Solis

on:
  workflow_dispatch:
  schedule:
    # 21:30 UTC = 18:30 em America/Bahia.
    - cron: "30 21 * * *"

permissions:
  contents: read

concurrency:
  group: manutencao-preventiva-solis
  cancel-in-progress: false

jobs:
  monitorar-usina:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar análise preventiva
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOLIS_API_ID: ${{ secrets.SOLIS_API_ID }}
          SOLIS_API_SECRET: ${{ secrets.SOLIS_API_SECRET }}
          SOLIS_BASE_URL: ${{ secrets.SOLIS_BASE_URL }}
          SOLIS_STATION_ID: ${{ secrets.SOLIS_STATION_ID }}
          STATION_LATITUDE: ${{ secrets.STATION_LATITUDE }}
          STATION_LONGITUDE: ${{ secrets.STATION_LONGITUDE }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHAT_ID: ${{ secrets.WHAPI_CHAT_ID }}
          MAINTENANCE_HISTORY_DAYS: ${{ secrets.MAINTENANCE_HISTORY_DAYS }}
          MAINTENANCE_RECENT_DAYS: ${{ secrets.MAINTENANCE_RECENT_DAYS }}
          MAINTENANCE_BASELINE_DAYS: ${{ secrets.MAINTENANCE_BASELINE_DAYS }}
          MAINTENANCE_CONFIRMATION_DAYS: ${{ secrets.MAINTENANCE_CONFIRMATION_DAYS }}
          MAINTENANCE_DROP_PERCENT: ${{ secrets.MAINTENANCE_DROP_PERCENT }}
          MAINTENANCE_MIN_RADIATION_WH_M2: ${{ secrets.MAINTENANCE_MIN_RADIATION_WH_M2 }}
        run: python maintenance_report.py
