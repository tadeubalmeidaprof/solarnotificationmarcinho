name: Debug Solis stationDay

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/debug-solis-station-day.yml"

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - run: pip install -r requirements.txt

      - name: Inspecionar estrutura segura do stationDay
        env:
          SOLIS_API_ID: ${{ secrets.SOLIS_API_ID }}
          SOLIS_API_SECRET: ${{ secrets.SOLIS_API_SECRET }}
          SOLIS_BASE_URL: ${{ secrets.SOLIS_BASE_URL }}
          SOLIS_STATION_ID: ${{ secrets.SOLIS_STATION_ID }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          from solar_queries import _client, _station_id

          target = (
              datetime.now(ZoneInfo("America/Bahia")).date()
              - timedelta(days=1)
          ).isoformat()

          response = _client().station_day(
              report_date=target,
              station_id=_station_id(),
              time_zone=-3,
              money="BRL",
          )

          def summarize(value, path="root", depth=0):
              if depth > 5:
                  return []
              out = []
              if isinstance(value, dict):
                  out.append({
                      "path": path,
                      "type": "dict",
                      "keys": sorted(str(k) for k in value.keys())[:40],
                  })
                  for key, child in value.items():
                      if isinstance(child, (dict, list)):
                          out.extend(
                              summarize(child, f"{path}.{key}", depth + 1)
                          )
              elif isinstance(value, list):
                  out.append({
                      "path": path,
                      "type": "list",
                      "length": len(value),
                  })
                  if value:
                      first = value[0]
                      if isinstance(first, dict):
                          safe_values = {}
                          for key in (
                              "time", "timeStr", "timeZone",
                              "power", "powerStr", "totalR",
                              "date", "energy", "pac", "value"
                          ):
                              if key in first:
                                  safe_values[key] = first.get(key)
                          out.append({
                              "path": f"{path}[0]",
                              "type": "dict",
                              "keys": sorted(
                                  str(k) for k in first.keys()
                              )[:60],
                              "safe_values": safe_values,
                          })
                          out.extend(
                              summarize(first, f"{path}[0]", depth + 1)
                          )
              return out

          data = response.get("data") if isinstance(response, dict) else None
          samples = []
          if isinstance(data, list) and data:
              for index in (0, len(data) // 2, len(data) - 1):
                  row = data[index]
                  if isinstance(row, dict):
                      samples.append({
                          "index": index,
                          "time": row.get("time"),
                          "timeStr": row.get("timeStr"),
                          "timeZone": row.get("timeZone"),
                          "power": row.get("power"),
                          "powerStr": row.get("powerStr"),
                          "totalR": row.get("totalR"),
                      })

          print(json.dumps({
              "target": target,
              "shape": summarize(response),
              "samples": samples,
          }, ensure_ascii=False, indent=2, default=str))
          PY
