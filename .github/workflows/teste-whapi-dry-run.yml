name: Teste Whapi sem envio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run-whapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxe
        run: python -m compileall -q .

      - name: Testar integração Whapi sem enviar mensagem
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHAT_ID: ${{ secrets.WHAPI_CHAT_ID }}
        run: python test_whapi_dry_run.py
