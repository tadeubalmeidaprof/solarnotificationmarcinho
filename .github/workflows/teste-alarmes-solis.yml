name: Teste de alarmes Solis

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Quantidade de dias do histórico a consultar"
        required: false
        default: "365"
  push:
    branches:
      - main
    paths:
      - "solisclient.py"
      - "test_alarms.py"
      - ".github/workflows/teste-alarmes-solis.yml"

permissions:
  contents: read

jobs:
  consultar-alarmes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxe
        run: python -m compileall -q solisclient.py test_alarms.py

      - name: Consultar alarmes da Solis
        env:
          SOLIS_API_ID: ${{ secrets.SOLIS_API_ID }}
          SOLIS_API_SECRET: ${{ secrets.SOLIS_API_SECRET }}
          SOLIS_BASE_URL: ${{ secrets.SOLIS_BASE_URL }}
          SOLIS_STATION_ID: ${{ secrets.SOLIS_STATION_ID }}
          ALARM_TEST_DAYS: ${{ github.event.inputs.days || '365' }}
        run: python test_alarms.py
