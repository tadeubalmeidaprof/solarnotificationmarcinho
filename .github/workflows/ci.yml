name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Import smoke test
        run: |
          python - <<'PY'
          import ai.assistant
          import ai.memory
          import ai.provider
          import ai.prompt
          import ai.tools
          import bot
          import config
          import database
          import curve_analysis
          import maintenance
          import maintenance_report
          import save_monthly_snapshot
          import savings_calculator
          import send_monthly_report
          import solar_queries
          import solis_alarm_monitor
          import solisclient
          import solisdaily
          import utils
          import weather
          import webhook
          import whatsapp
          PY

      - name: Unit tests
        run: python -m unittest discover -s tests -v
